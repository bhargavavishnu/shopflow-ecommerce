[project]
name = "shopflow-ecommerce-backend"
version = "0.1.0"
description = "Django REST Framework e-commerce backend with transactional inventory locking, Stripe test checkout, Celery async tasks, and PostgreSQL full-text search"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.4.0",
    "django>=5.1.0,<5.2",
    "django-cors-headers>=4.4.0",
    "djangorestframework>=3.15.2",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.3",
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.9.0",
    "redis>=5.2.0",
    "stripe>=11.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "shopflow.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "--reuse-db"
